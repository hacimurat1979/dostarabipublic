<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sayfa bulunamadı — Dost Arabî</title>
<meta name="robots" content="noindex">
<meta name="description" content="Aradığınız adres bulunamadı. Dost Arabî ana sayfasına dönebilir ya da dizinden bir bölüm seçebilirsiniz.">
<script>
  // GitHub Pages statik dosya sunucusu olduğu için /futuhat/c1k9 gibi
  // gerçek path'lere doğrudan gelindiğinde (adres çubuğuna yazma, dış
  // bağlantı, sayfa yenileme) burada 404 döner. İstenen path'i bir sorgu
  // parametresine gömüp köke yönlendiriyoruz; index.html açılışında bunu
  // okuyup adres çubuğunu tekrar temiz path'e çeviriyor (bkz. index.html).
  (function () {
    // dostarabi.com kökten servis ediyor (basePrefix ""); önizleme kopyası
    // hacimurat1979.github.io/dost-onizleme/ altında servis edildiği için
    // bu satır index.html'in gerçekte nerede durduğunu bilsin diye
    // "/dost-onizleme" yapılır (bkz. scripts/sync-to-preview.py). Hedef
    // path'in kendisi (prefix dahil, olduğu gibi) korunur -- onu prefix'ten
    // arındırıp adres çubuğuna geri koyma işini ontology.js (ROUTE_BASE) yapar.
    var basePrefix = "";
    var loc = window.location;
    // Android uygulaması (TWA) kendini ?kaynak=twa ya da android-app://
    // yönlendiricisiyle tanıtır (index.html). Bu yönlendirmeden sonra
    // yönlendirici bu sayfa olur; işaret oturuma burada yazılır (2026-10-11).
    try {
      if (/(?:^|[?&])kaynak=twa(?:&|$)/.test(loc.search) || String(document.referrer).indexOf("android-app://com.dostarabi.app") === 0) sessionStorage.setItem("dost-uygulama", "1");
    } catch (e) {}
    var target = loc.pathname + loc.search + loc.hash;
    loc.replace(loc.origin + basePrefix + "/?p=" + encodeURIComponent(target));
  })();
</script>
</head>
<body>
<!-- S10 (2026-11-07): JS açıkken bu sayfa anında uygulamaya yönlenir ve yanlış adres için yakın yol / arama önerisi orada gösterilir (assets/ontology.js);
     JS kapalıyken ya da yönlendirme çalışmazsa okuyucu burada kısa üç dilli bir yol bulur. Üç dil birlikte. -->
<noscript>
<main style="font-family:system-ui,sans-serif;max-width:34rem;margin:12vh auto;padding:0 16px;line-height:1.6">
<section lang="tr"><h1 style="font-size:1.4rem">Sayfa bulunamadı</h1>
<p>Aradığınız adres bulunamadı. <a href="/">Ana sayfa</a> ya da <a href="/dizin/">dizin</a> üzerinden devam edebilirsiniz.</p></section>
<section lang="en"><h2 style="font-size:1.1rem">Page not found</h2>
<p>We couldn't find that address. Continue from the <a href="/en/">home page</a> or the <a href="/dizin/">index</a>.</p></section>
<section lang="pt-BR"><h2 style="font-size:1.1rem">Página não encontrada</h2>
<p>Não encontramos esse endereço. Continue pela <a href="/pt/">página inicial</a> ou pelo <a href="/dizin/">índice</a>.</p></section>
</main>
</noscript>
</body>
</html>
