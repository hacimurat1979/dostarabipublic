    <section class="intro" id="intro-text-temalar" hidden>
      <p data-tr="Aşağıdaki takımyıldızda ortadaki altın düğümler, iki dünyanın örtüştüğü temaları gösteriyor — birine tıklayın. Köprüleri biz kurduk: Daphne'nin alıntıları İbn Arabî'yi anmıyor; her temayı bir İbn Arabî kavramıyla biz eşleştirdik ve yankıyı biz yazdık."
         data-en="In the constellation below, the golden nodes at the center are the themes where the two worlds overlap — click one. We built these bridges: Daphne's quotations do not mention Ibn Arabi; we paired each theme with an Ibn Arabi concept and wrote the resonance ourselves."
         data-pt="Na constelação abaixo, os nós dourados no centro são os temas onde os dois mundos se sobrepõem — clique em um. Fomos nós que construímos estas pontes: as citações de Daphne não mencionam Ibn Arabi; emparelhámos cada tema com um conceito de Ibn Arabi e escrevemos nós a ressonância.">
      </p>
    </section>

    <section class="intro" id="intro-text-bagharita" hidden>
      <p data-tr="Taradığımız her yazıda, Dost'un hangi kavramına dokunduğunu elle işaretledik; burası o bağların hepsinin bir arada durduğu yer. Bağları ve gerekçelerini biz yazdık; 5 Ekim 2026'dan sonra eklenen yazılarda bağ işaretlenmedi. Merkezde Daphne var; bir kavram ne kadar çok yazıda dönüyorsa merkeze o kadar yakın duruyor. Bu bir puan değil, bir sayım: neyin tekrar ettiğini gösteriyor, ne anlama geldiğini değil. Bir düğüme tıklayın."
         data-en="For each piece we surveyed, we marked by hand which of Dost's concepts it touches; this is where all those links stand together. We wrote the links and their reasons ourselves; pieces added after 5 October 2026 carry no marked links. Daphne is at the center; the more essays return to a concept, the closer it sits. This is not a score but a count: it shows what recurs, not what it means. Click a node."
         data-pt="Em cada texto que analisámos, marcámos à mão quais conceitos de Dost ele toca; aqui é onde todos esses vínculos se encontram. Fomos nós que escrevemos os vínculos e as suas razões; os textos acrescentados depois de 5 de outubro de 2026 não têm vínculos marcados. Daphne está no centro; quanto mais ensaios retornam a um conceito, mais perto ele fica. Isto não é uma pontuação, mas uma contagem: mostra o que se repete, não o que significa. Clique num nó.">
      </p>
      <p class="intro__olcu" id="bagharita-olcu"></p>
    </section>

    <section class="intro" id="intro-text-baglar" hidden>
      <p data-tr="Daphne'nin yazılarında tekrar eden eksenler; her iplik bir eksenin geçtiği yazıları birleştirir. Yazılar yayın tarihine göre bir sarmala dizili. Eksenleri ve her yazının hangi ekseni taşıdığını biz işaretledik (Daphne'nin Profili sekmesindeki eksenler). Bu bir sayım: neyin tekrar ettiğini gösteriyor, ne anlama geldiğini değil. Bir eksene değinin; bir yazıyı seçince kartı açılır."
         data-en="The axes that recur in Daphne's writing; each thread joins the pieces an axis runs through. The pieces are laid on a spiral by publication date. We marked the axes, and which axes each piece carries (the axes of the Daphne's Profile tab). This is a count: it shows what recurs, not what it means. Touch an axis; select a piece to open its card."
         data-pt="Os eixos que se repetem nos textos de Daphne; cada fio une os textos por onde um eixo passa. Os textos estão dispostos numa espiral pela data de publicação. Fomos nós que marcámos os eixos e quais eixos cada texto traz (os eixos do separador O Perfil de Daphne). Isto é uma contagem: mostra o que se repete, não o que significa. Toque num eixo; selecione um texto para abrir o seu cartão.">
      </p>
      <p class="intro__olcu" id="baglar-olcu"></p>
    </section>

    <section class="intro" id="intro-text-profile">
      <p data-tr="Bu harita, Dost ile örtüşüp örtüşmediğine bakmaksızın, Daphne'nin (thelivingfractal) kendi yazılarında tekrar tekrar döndüğü eksenleri bir araya getirmeye çalışıyor. Merkezdeki düğüm Daphne, çevresindekiler ise onun kendi cümleleriyle -- mümkün olduğunca -- kurulmuş temel parametreler. Bu kapanmış bir profil değil; yeni bir yazı paylaşıldıkça güncellenen bir taslak. Bir düğüme tıklayın."
         data-en="This map tries to gather, independent of any overlap with Dost, the axes Daphne's (thelivingfractal) own writing keeps returning to. The center node is Daphne; the surrounding ones are core parameters built, as much as possible, from her own words. This is not a closed profile -- it is a draft that updates as new pieces are shared. Click a node."
         data-pt="Este mapa tenta reunir, independentemente de qualquer sobreposição com Dost, os eixos aos quais a própria escrita de Daphne (thelivingfractal) retorna repetidamente. O nó central é Daphne; os que a rodeiam são parâmetros centrais construídos, tanto quanto possível, a partir de suas próprias palavras. Este não é um perfil fechado -- é um rascunho que se atualiza à medida que novos textos são compartilhados. Clique num nó.">
      </p>
    </section>

      var accept = document.getElementById("consent-accept");
      var decline = document.getElementById("consent-decline");
